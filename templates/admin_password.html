{% extends "base.html" %}
{% block title %}Admin Security — CropGuard AI{% endblock %}
{% block content %}

<section class="cg-section pt-4">
  <div class="container">
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-cg-outline btn-sm mb-4"><i class="fa-solid fa-arrow-left me-1"></i>Back to dashboard</a>

    <div class="cg-form-card">
      <h5 class="mb-1"><i class="fa-solid fa-key me-2" style="color:var(--amber)"></i>Update admin credentials</h5>
      <p class="text-muted small mb-4">Choose a strong password with at least 8 characters.</p>
      <form method="POST" action="{{ url_for('admin_password') }}">
        <div class="mb-3">
          <label class="form-label">Current password</label>
          <input type="password" class="form-control" name="current_password" required>
        </div>
        <div class="mb-3">
          <label class="form-label">New password</label>
          <input type="password" class="form-control" name="new_password" minlength="8" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Confirm new password</label>
          <input type="password" class="form-control" name="confirm_password" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-cg-primary w-100">Update password</button>
      </form>
    </div>
  </div>
</section>

{% endblock %}
